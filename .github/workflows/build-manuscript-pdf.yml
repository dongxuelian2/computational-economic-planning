name: Build and publish manuscript PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-manuscript-pdf.yml'
      - 'manuscript/main.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile LaTeX manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: manuscript
          latexmk_use_xelatex: false
      - name: Publish compiled PDF to repository
        run: |
          test -s manuscript/main.pdf
          pdfinfo manuscript/main.pdf | head -12 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f manuscript/main.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish compiled inventory manuscript PDF"
            git push origin HEAD:main
          fi
